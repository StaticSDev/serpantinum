# Starship prompt configuration - Serpantinum dynamic theme
add_newline = true
palette = "serpantinum"

format = """
$directory$git_branch$git_status$fill$cmd_duration$status
$character"""

# BEGIN_SERPANTINUM_PALETTE
[palettes.serpantinum]
mauve = "#d0d0d0"
sapphire = "#e0e0e0"
blue = "#ffffff"
peach = "#cccccc"
green = "#ffffff"
red = "#a0a0a0"
surface0 = "#1a1a1a"
text = "#ffffff"
# END_SERPANTINUM_PALETTE

[directory]
style = "bold mauve"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style) "

[git_branch]
style = "bold sapphire"
symbol = " "
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2_000
style = "bold peach"
format = "took [$duration]($style) "

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"
